[workspace]
resolver = "3"

[package]
name = "hartevo-gcp-recommender-result-plugin"
description = "Layer-1 governed Google Cloud Recommender and Insight result proposal seam"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
authors = ["Hartevo"]
repository = "https://github.com/tangpingqingwa/hartevo-desktop"
publish = false

[dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
similar_names = "allow"
unnecessary_wraps = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
