[workspace]
members = ["."]
resolver = "3"

[package]
name = "hartevo-fastly-service-result-plugin"
description = "Standalone Layer-1 governed Fastly service-result plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
authors = ["Hartevo"]
repository = "https://github.com/tangpingqingwa/hartevo-desktop"
publish = false

[dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
result_large_err = "allow"
needless_pass_by_value = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
if_not_else = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

# This crate is intentionally a standalone root. The protected desktop
# workspace is not edited until a later integration decision.
