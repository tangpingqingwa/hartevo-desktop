[package]
name = "hartevo-servicenow-change-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
description = "Layer-1 read-only ServiceNow change and approval provider contract"

[workspace]
resolver = "3"

[dependencies]
hartevo-connector-sdk = { path = "../connector-sdk" }
hartevo-domain-kernel = { path = "../domain-kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"
