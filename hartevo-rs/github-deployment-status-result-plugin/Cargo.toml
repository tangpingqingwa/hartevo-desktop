[workspace]
members = ["."]
resolver = "3"

[package]
name = "hartevo-github-deployment-status-result-plugin"
description = "Standalone Layer-1 governed GitHub Deployment and Deployment Status evidence seam"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
