[workspace]
members = ["."]
resolver = "3"

[package]
name = "hartevo-mailgun-delivery-result-plugin"
description = "Standalone Layer-1 governed Mailgun delivery-result evidence plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
publish = false

[dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
result_large_err = "allow"
