[workspace]
members = ["."]
resolver = "3"

[package]
name = "hartevo-azure-resource-graph-result-plugin"
description = "Layer-1 governed Azure Resource Graph inventory result evidence and proposal seam"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
authors = ["Hartevo"]
repository = "https://github.com/tangpingqingwa/hartevo-desktop"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hartevo-plugin-runtime = { path = "../plugin-runtime" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# This crate is intentionally a standalone root. The protected desktop
# workspace is not edited until a later integration decision.
