[package]
name = "hartevo-pubmed-research-result-plugin"
description = "Layer-1 governed PubMed biomedical research metadata result and Mission proposal seam"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
authors = ["Hartevo"]
repository = "https://github.com/tangpingqingwa/hartevo-desktop"
publish = false

# This nested workspace is intentionally standalone. Native NCBI credential
# resolution and HTTPS execution belong to a later reviewed layer.
[workspace]
resolver = "3"

[dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
result_large_err = "allow"
