[package]
name = "hartevo-desktop"
description = "Dioxus desktop shell for Hartevo's Mission workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
chrono.workspace = true
command-group.workspace = true
dioxus.workspace = true
dioxus-icons = "0.1"
futures-executor.workspace = true
futures-util.workspace = true
hartevo-application = { path = "../application" }
hartevo-browser-adapter = { path = "../browser-adapter" }
hartevo-catalog = { path = "../catalog" }
hartevo-context-fabric = { path = "../context-fabric" }
hartevo-cordis = { path = "../cordis" }
hartevo-domain-kernel = { path = "../domain-kernel" }
hartevo-effect-broker = { path = "../effect-broker" }
hartevo-runtime-adapter = { path = "../runtime-adapter" }
hartevo-storage = { path = "../storage" }
hex.workspace = true
rust_decimal.workspace = true
sha2.workspace = true
serde = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
bundle = []
native-journey = ["dep:serde"]
visual-fixtures = ["dep:serde"]

[lints]
workspace = true

[[bin]]
name = "hartevo-desktop"
path = "src/main.rs"
