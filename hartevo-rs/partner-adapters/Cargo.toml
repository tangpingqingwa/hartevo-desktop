[package]
name = "hartevo-partner-adapters"
description = "Provider-specific partner network adapters"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hartevo-connector-sdk = { path = "../connector-sdk" }
hartevo-domain-kernel = { path = "../domain-kernel" }
hartevo-effect-broker = { path = "../effect-broker" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
ureq = "2.12.1"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace]
