[package]
name = "hartevo-wandb-evaluation-result-plugin"
description = "Layer-1 governed W&B evaluation-result evidence proposal seam"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
authors = ["Hartevo"]
repository = "https://github.com/tangpingqingwa/hartevo-desktop"
publish = false

# This nested workspace is intentionally standalone. Host wiring belongs to
# the Integration Manager and is outside EXT-WANDB-01 ownership.
[workspace]
resolver = "3"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.11.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
