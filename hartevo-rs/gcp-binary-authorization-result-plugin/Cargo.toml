[package]
name = "hartevo-gcp-binary-authorization-result-plugin"
description = "Standalone Layer-1 GCP Binary Authorization policy, attestor, and validation evidence plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
authors = ["Hartevo"]
repository = "https://github.com/tangpingqingwa/hartevo-desktop"

# This crate is intentionally standalone. Host wiring and native authority
# remain outside Issue #529's ownership roots.
[workspace]
resolver = "3"

[dependencies]
hartevo-plugin-runtime = { path = "../plugin-runtime" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
