[package]
name = "hartevo-ninjaone-device-result-plugin"
description = "Standalone Layer-1 bounded NinjaOne endpoint-device result plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
authors = ["Hartevo"]
repository = "https://github.com/tangpingqingwa/hartevo-desktop"
publish = false

# This crate is deliberately independent from the host workspace. Host wiring,
# native OAuth resolution, and any effect authority remain outside this root.
[workspace]
members = ["."]
resolver = "3"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
unreadable_literal = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
match_same_arms = "allow"
if_not_else = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
missing_const_for_fn = "allow"
