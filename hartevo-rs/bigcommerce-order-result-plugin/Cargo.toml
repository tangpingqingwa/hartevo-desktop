[package]
name = "hartevo-bigcommerce-order-result-plugin"
description = "Standalone Layer-1 bounded BigCommerce order result plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
publish = false

# This nested workspace is intentionally standalone. Host wiring, native
# credentials, and kernel authority belong to a later reviewed layer.
[workspace]
resolver = "3"

[dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.11"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
result_large_err = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
