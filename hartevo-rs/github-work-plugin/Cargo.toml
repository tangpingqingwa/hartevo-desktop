[package]
name = "hartevo-github-work-plugin"
description = "Mission-scoped GitHub App repository work read and proposal slice"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
authors = ["Hartevo"]
repository = "https://github.com/tangpingqingwa/hartevo-desktop"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hartevo-connector-sdk = { path = "../connector-sdk" }
hartevo-domain-kernel = { path = "../domain-kernel" }
hartevo-effect-broker = { path = "../effect-broker" }
hartevo-plugin-runtime = { path = "../plugin-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
ureq = "3.4"
url = "2.5"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# This crate is intentionally a standalone root draft.  The protected desktop
# workspace is not edited until a later integration decision.
[workspace]
