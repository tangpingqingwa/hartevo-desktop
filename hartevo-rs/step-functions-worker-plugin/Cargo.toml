[package]
name = "hartevo-step-functions-worker-plugin"
description = "Layer-1 AWS Step Functions Mission worker/result contract and provider seam"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"

# This package is intentionally independently testable.  The repository root
# workspace is not edited for Layer 1, so this empty workspace boundary keeps
# Cargo from requiring root Cargo.toml/Cargo.lock membership.
[workspace]

[dependencies]
hartevo-connector-sdk = { path = "../connector-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
