[package]
name = "hartevo-gitlab-work-plugin"
description = "Standalone, read-only GitLab Mission-to-MR work and pipeline-result Layer-1 plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"

[workspace]
resolver = "3"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
