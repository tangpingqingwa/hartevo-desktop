name: Governance / Trusted admission

on:
  # Trusted code is always checked out from the protected base.  The exact
  # untrusted head is fetched as an object and never executed with this token.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # A new exact-head review must re-run admission.  A later code push is
  # automatically stale because the review commit_id no longer matches.
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hartevo-governance-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admission:
    name: Governance / PR admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted protected governance policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Fetch the exact untrusted head without checking it out
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --no-write-fetch-head origin "$HEAD_SHA"
      - name: Capture read-only exact-head GitHub review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            > "$RUNNER_TEMP/github-reviews.json"
      - name: Verify exact trusted-base admission
        run: |
          python3 scripts/repository_governance.py verify-pr-event \
            --event "$GITHUB_EVENT_PATH" \
            --event-name "${{ github.event_name == 'pull_request_review' && 'pull_request_review' || 'pull_request' }}" \
            --trusted-base \
            --github-reviews "$RUNNER_TEMP/github-reviews.json"
