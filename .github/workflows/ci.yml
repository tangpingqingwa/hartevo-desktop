name: PR / Fast CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.head_ref, 'merge-train/') && 'hartevo-merge-train' || format('hartevo-pr-{0}-{1}', github.workflow, github.event.pull_request.number || github.event.merge_group.head_sha || github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target/ci-cargo

jobs:
  policy:
    name: PR / Workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout untrusted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse workflow YAML
        run: bash scripts/ci-workflow-syntax.sh verify
      - name: Verify workflow, action-pin and branch-policy contracts
        run: |
          python3 scripts/ci-workflow-policy.py verify
          python3 scripts/ci-workflow-policy.py verify-pins
          python3 scripts/ci-branch-policy.py verify
          python3 scripts/repository_governance.py verify-repository
          python3 scripts/repository_governance.py verify-pr-event \
            --event "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME"
          bash scripts/ci-tests.sh

  scope:
    name: PR / Scope plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      rust: ${{ steps.plan.outputs.rust }}
      common_rust: ${{ steps.plan.outputs.common_rust }}
      common_rust_packages: ${{ steps.plan.outputs.common_rust_packages }}
      desktop: ${{ steps.plan.outputs.desktop }}
      desktop_packages: ${{ steps.plan.outputs.desktop_packages }}
      dependency_changed: ${{ steps.plan.outputs.dependency_changed }}
      dependency_only: ${{ steps.plan.outputs.dependency_only }}
      receipt_only: ${{ steps.plan.outputs.receipt_only }}
      packages: ${{ steps.plan.outputs.packages }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout history for an exact diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      - id: plan
        name: Plan conservative changed scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          IS_MERGE_TRAIN: ${{ startsWith(github.head_ref, 'merge-train/') }}
        run: |
          mkdir -p target/ci
          if [[ "$GITHUB_EVENT_NAME" == merge_group || "$IS_MERGE_TRAIN" == true ]]; then
            common='["hartevo-application","hartevo-browser-adapter","hartevo-capability-gateway","hartevo-catalog","hartevo-channel-adapters","hartevo-cloud-storage","hartevo-commerce-connector","hartevo-connector-sdk","hartevo-context-fabric","hartevo-cordis","hartevo-domain-kernel","hartevo-effect-broker","hartevo-eval","hartevo-mission-scheduler","hartevo-plugin-runtime","hartevo-runtime-adapter","hartevo-storage"]'
            desktop='["hartevo-desktop"]'
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'rust=true' >> "$GITHUB_OUTPUT"
            echo 'common_rust=true' >> "$GITHUB_OUTPUT"
            echo "common_rust_packages=$common" >> "$GITHUB_OUTPUT"
            echo 'desktop=true' >> "$GITHUB_OUTPUT"
            echo "desktop_packages=$desktop" >> "$GITHUB_OUTPUT"
            echo 'dependency_changed=true' >> "$GITHUB_OUTPUT"
            echo 'dependency_only=false' >> "$GITHUB_OUTPUT"
            echo 'receipt_only=false' >> "$GITHUB_OUTPUT"
            echo "packages=[$(printf '%s' "$common" | sed 's/^\[//;s/\]$//'),\"hartevo-desktop\"]" >> "$GITHUB_OUTPUT"
            echo 'plan={"schema":"hartevo-ci-scope/v2","mode":"full_integration","full":true,"rust":true,"commonRust":true,"desktop":true,"dependencyChanged":true,"dependencyOnly":false,"receiptOnly":false}' >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"schema":"hartevo-ci-scope/v2","mode":"full_integration","full":true,"rust":true,"commonRust":true,"desktop":true,"dependencyChanged":true,"dependencyOnly":false,"receiptOnly":false}' | tee target/ci/scope.json
          else
            python3 scripts/ci-scope.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --pr-number "$PR_NUMBER" \
              --github-output "$GITHUB_OUTPUT" \
              | tee target/ci/scope.json
          fi
      - name: Upload redacted scope evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-scope-${{ github.run_id }}
          path: target/ci/scope.json
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: PR / Fast Rust matrix
    needs: scope
    uses: ./.github/workflows/rust-reusable.yml
    with:
      check_prefix: PR / Fast Rust
      run_rust: ${{ needs.scope.outputs.rust == 'true' }}
      run_common_rust: ${{ needs.scope.outputs.common_rust == 'true' }}
      run_desktop: ${{ needs.scope.outputs.desktop == 'true' }}
      run_macos: ${{ needs.scope.outputs.desktop == 'true' }}
      full_workspace: false
      rust_packages: ${{ needs.scope.outputs.packages }}
      common_rust_packages: ${{ needs.scope.outputs.common_rust_packages }}
      desktop_packages: ${{ needs.scope.outputs.desktop_packages }}
    permissions:
      contents: read

  dependency:
    name: PR / Dependency audit
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Planned scope skip marker
        if: ${{ needs.scope.outputs.dependency_changed != 'true' }}
        run: echo "No Cargo dependency input changed."
      - name: Checkout locked dependency source
        if: needs.scope.outputs.dependency_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned cargo-audit
        if: needs.scope.outputs.dependency_changed == 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Verify locked metadata, dependency tree, audit and SBOM
        if: needs.scope.outputs.dependency_changed == 'true'
        run: |
          mkdir -p target/ci/dependencies
          test -s Cargo.lock
          cargo metadata --format-version 1 --locked > target/ci/dependencies/metadata.json
          cargo tree --workspace --locked --edges normal > target/ci/dependencies/tree.txt
          cargo audit --json > target/ci/dependencies/cargo-audit.json
          python3 scripts/ci-dependency-audit.py audit \
            --metadata target/ci/dependencies/metadata.json \
            --tree target/ci/dependencies/tree.txt \
            --lock Cargo.lock \
            --cargo-audit-json target/ci/dependencies/cargo-audit.json \
            --output target/ci/dependencies/sbom.json
      - name: Narrow dependency smoke check
        if: needs.scope.outputs.dependency_changed == 'true'
        run: cargo metadata --format-version 1 --locked >/dev/null
      - name: Upload dependency evidence
        if: always() && needs.scope.outputs.dependency_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-dependency-evidence-${{ github.run_id }}
          path: target/ci/dependencies
          if-no-files-found: warn
          retention-days: 14

  dependency-cordis-smoke:
    name: PR / Dependency Cordis smoke
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Planned scope skip marker
        if: ${{ needs.scope.outputs.dependency_only != 'true' }}
        run: echo "Dependency-only Cordis smoke is not planned for this change."
      - name: Checkout locked dependency source
        if: needs.scope.outputs.dependency_only == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run narrow locked Cordis smoke
        if: needs.scope.outputs.dependency_only == 'true'
        run: cargo test -p hartevo-cordis --locked --lib

  dependency-desktop-smoke:
    name: PR / Dependency desktop smoke
    needs: scope
    runs-on: ${{ needs.scope.outputs.dependency_only != 'true' && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Planned scope skip marker
        if: ${{ needs.scope.outputs.dependency_only != 'true' }}
        run: echo "Dependency-only desktop smoke is not planned for this change."
      - name: Checkout locked dependency source
        if: needs.scope.outputs.dependency_only == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run narrow locked desktop smoke
        if: needs.scope.outputs.dependency_only == 'true'
        run: cargo test -p hartevo-desktop --locked --lib

  result:
    name: PR / Result taxonomy
    if: always()
    needs: [policy, scope, rust, dependency, dependency-cordis-smoke, dependency-desktop-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout result verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Capture hosted job execution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/ci
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > target/ci/github-jobs.json
      - name: Classify every planned and relevant lane
        env:
          COMMON_RUST: ${{ needs.scope.outputs.common_rust }}
          DESKTOP: ${{ needs.scope.outputs.desktop }}
          DEPENDENCY_CHANGED: ${{ needs.scope.outputs.dependency_changed }}
          DEPENDENCY_ONLY: ${{ needs.scope.outputs.dependency_only }}
        run: |
          mkdir -p target/ci
          planned=()
          if [[ "$COMMON_RUST" != true && "$DESKTOP" != true ]]; then
            planned+=(--planned-scope rust)
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / fmt")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / clippy (ubuntu-24.04)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / clippy (macos-15)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test shard 0 of 2 (ubuntu-24.04)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test shard 1 of 2 (ubuntu-24.04)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test (ubuntu-24.04)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test (macos-15)")
          elif [[ "$COMMON_RUST" != true ]]; then
            planned+=(--planned-scope common-rust)
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / clippy (ubuntu-24.04)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test shard 0 of 2 (ubuntu-24.04)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test shard 1 of 2 (ubuntu-24.04)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test (ubuntu-24.04)")
          fi
          if [[ "$DESKTOP" != true && "$COMMON_RUST" == true ]]; then
            planned+=(--planned-scope desktop)
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / clippy (macos-15)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test (macos-15)")
          fi
          if [[ "$DEPENDENCY_CHANGED" != true ]]; then
            planned+=(--planned-scope dependency)
            planned+=(--planned-job-name "PR / Dependency audit")
            planned+=(--planned-job-name "PR / Dependency Cordis smoke")
            planned+=(--planned-job-name "PR / Dependency desktop smoke")
          elif [[ "$DEPENDENCY_ONLY" != true ]]; then
            planned+=(--planned-scope dependency-smoke)
            planned+=(--planned-job-name "PR / Dependency Cordis smoke")
            planned+=(--planned-job-name "PR / Dependency desktop smoke")
          fi
          python3 scripts/ci-result.py aggregate \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --output target/ci/result.json \
            --junit target/ci/result.xml \
            --github-jobs-json target/ci/github-jobs.json \
            --job "policy=${{ needs.policy.result }}" \
            --job "scope=${{ needs.scope.result }}" \
            --job "rust=${{ needs.rust.result }}" \
            --job "dependency=${{ needs.dependency.result }}" \
            --job "dependency-cordis-smoke=${{ needs.dependency-cordis-smoke.result }}" \
            --job "dependency-desktop-smoke=${{ needs.dependency-desktop-smoke.result }}" \
            --job-name "policy=PR / Workflow policy" \
            --job-name "scope=PR / Scope plan" \
            --job-name "rust=PR / Fast Rust matrix" \
            --job-name "dependency=PR / Dependency audit" \
            --job-name "dependency-cordis-smoke=PR / Dependency Cordis smoke" \
            --job-name "dependency-desktop-smoke=PR / Dependency desktop smoke" \
            --kind policy=code \
            --kind scope=infra \
            --kind rust=code \
            --kind dependency=infra \
            --kind dependency-cordis-smoke=code \
            --kind dependency-desktop-smoke=code \
            "${planned[@]}"
      - name: Upload redacted CI result and JUnit envelope
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ci-result-${{ github.run_id }}
          path: |
            target/ci/result.json
            target/ci/result.xml
            target/ci/github-jobs.json
          if-no-files-found: warn
          retention-days: 14
