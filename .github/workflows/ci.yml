name: PR / Fast CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # A personal-account public repository cannot use GitHub's hosted merge
  # queue. Serialize the repository-owned composite train while ordinary PRs
  # retain independent cancellation domains.
  group: ${{ startsWith(github.head_ref, 'merge-train/') && 'hartevo-merge-train' || format('hartevo-pr-{0}-{1}', github.workflow, github.event.pull_request.number || github.event.merge_group.head_sha || github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target/ci-cargo

jobs:
  policy:
    name: PR / Workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout untrusted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse workflow YAML
        run: bash scripts/ci-workflow-syntax.sh verify
      - name: Verify workflow, action-pin and branch-policy contracts
        run: |
          python3 scripts/ci-workflow-policy.py verify
          python3 scripts/ci-workflow-policy.py verify-pins
          python3 scripts/ci-branch-policy.py verify
          bash scripts/ci-tests.sh

  scope:
    name: PR / Scope plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      rust: ${{ steps.plan.outputs.rust }}
      packages: ${{ steps.plan.outputs.packages }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout history for an exact diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # pull_request defaults to GitHub's temporary merge ref. Scope and
          # merge-train proof must instead bind the exact reviewed head SHA.
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      - id: plan
        name: Plan conservative changed scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.head_ref }}
          IS_MERGE_TRAIN: ${{ startsWith(github.head_ref, 'merge-train/') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/ci
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'rust=true' >> "$GITHUB_OUTPUT"
            echo 'packages=[]' >> "$GITHUB_OUTPUT"
            echo 'plan={"mode":"merge_group_full","full":true,"rust":true,"packages":[]}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              '{"schema":"hartevo-ci-scope/v1","mode":"merge_group_full","full":true,"rust":true,"packages":[]}' \
              > target/ci/scope.json
          elif [[ "$IS_MERGE_TRAIN" == true ]]; then
            python3 scripts/ci-merge-train.py verify-hosted \
              --repo "$GITHUB_REPOSITORY" \
              --manifest .github/merge-train/current.json \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --branch "$HEAD_REF"
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'rust=true' >> "$GITHUB_OUTPUT"
            echo 'packages=[]' >> "$GITHUB_OUTPUT"
            echo 'plan={"mode":"repository_merge_train_full","full":true,"rust":true,"packages":[]}' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              '{"schema":"hartevo-ci-scope/v1","mode":"repository_merge_train_full","full":true,"rust":true,"packages":[]}' \
              > target/ci/scope.json
          else
            python3 scripts/ci-scope.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT" \
              | tee target/ci/scope.json
          fi
      - name: Upload redacted scope evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-scope-${{ github.run_id }}
          path: target/ci/scope.json
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: PR / Fast Rust matrix
    needs: scope
    uses: ./.github/workflows/rust-reusable.yml
    with:
      check_prefix: PR / Fast Rust
      run_rust: ${{ needs.scope.outputs.rust == 'true' }}
      run_macos: ${{ github.event_name == 'merge_group' || startsWith(github.head_ref, 'merge-train/') }}
      full_workspace: ${{ github.event_name == 'merge_group' || startsWith(github.head_ref, 'merge-train/') || needs.scope.outputs.full == 'true' }}
      rust_packages: ${{ needs.scope.outputs.packages }}
    permissions:
      contents: read

  result:
    name: PR / Result taxonomy
    if: always()
    needs: [policy, scope, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout result verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Capture hosted job execution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/ci
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > target/ci/github-jobs.json
      - name: Classify job outcomes
        env:
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          RUN_MACOS: ${{ github.event_name == 'merge_group' || startsWith(github.head_ref, 'merge-train/') }}
        run: |
          mkdir -p target/ci
          planned=()
          if [[ "$RUST_SCOPE" == false ]]; then
            planned+=(--planned-scope rust)
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / fmt")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / clippy (ubuntu-24.04)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / clippy (macos-15)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test (ubuntu-24.04)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test (macos-15)")
          elif [[ "$RUN_MACOS" != true ]]; then
            planned+=(--planned-scope macos)
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / clippy (macos-15)")
            planned+=(--planned-job-name "PR / Fast Rust matrix / PR / Fast Rust / test (macos-15)")
          fi
          python3 scripts/ci-result.py aggregate \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --output target/ci/result.json \
            --junit target/ci/result.xml \
            --github-jobs-json target/ci/github-jobs.json \
            --job "policy=${{ needs.policy.result }}" \
            --job "scope=${{ needs.scope.result }}" \
            --job "rust=${{ needs.rust.result }}" \
            --job-name "policy=PR / Workflow policy" \
            --job-name "scope=PR / Scope plan" \
            --job-name "rust=PR / Fast Rust matrix" \
            --kind policy=code \
            --kind scope=infra \
            --kind rust=code \
            "${planned[@]}"
      - name: Upload redacted CI result and JUnit envelope
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ci-result-${{ github.run_id }}
          path: |
            target/ci/result.json
            target/ci/result.xml
            target/ci/github-jobs.json
          if-no-files-found: warn
          retention-days: 14
