name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Validate Mission, Provider and Dataset catalogs
        run: cargo run -p hartevo-eval -- catalog validate
      - name: Export traceability and honest release baseline
        run: |
          cargo run -p hartevo-eval -- catalog export --output target/eval/catalog-v1.json
          cargo run -p hartevo-eval -- evidence baseline --commit "${GITHUB_SHA}" --output target/eval/release-baseline.json
      - name: Desktop smoke compile
        run: cargo check -p hartevo-desktop --all-features
      - name: Verify OpenInterpreter schema pin
        run: bash scripts/check-openinterpreter-schema.sh
      - name: Replay the controlled Mission slice
        run: cargo run -p hartevo-eval -- run --mission VS-01 --output target/eval/vs-01.json
      - name: Upload contract and bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hartevo-contract-evidence-${{ github.sha }}
          path: target/eval/*.json
          if-no-files-found: error

  postgres-l2:
    name: PostgreSQL 18 Cell contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create non-bypass Cell role and disposable database
        env:
          PGPASSWORD: postgres
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE hartevo_l2 LOGIN PASSWORD 'hartevo_l2'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE DATABASE hartevo_l2 OWNER hartevo_l2;
          SQL
      - name: Run migration, RLS, encrypted sync, CAS, Effect fencing, and recovery replay
        env:
          HARTEVO_TEST_POSTGRES_URL: host=127.0.0.1 port=5432 user=hartevo_l2 password=hartevo_l2 dbname=hartevo_l2 sslmode=disable
        run: |
          cargo test -p hartevo-cloud-storage \
            tests::postgres_l2_contract_reports_blocked_or_executes_full_replay \
            -- --nocapture --exact
          cargo test -p hartevo-cloud-storage \
            effect_ledger::tests::postgres_effect_claim_contract_reports_blocked_or_executes_full_recovery \
            -- --nocapture --exact
          cargo test -p hartevo-cloud-storage \
            effect_ledger::tests::postgres_effect_concurrency_and_terminal_recovery_reports_blocked_or_executes \
            -- --nocapture --exact
          cargo test -p hartevo-cloud-storage \
            effect_ledger::tests::postgres_effect_reconciliation_reports_blocked_or_executes_bounded_recovery \
            -- --nocapture --exact
