name: PR / Fast CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: hartevo-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target/ci-cargo

jobs:
  policy:
    name: PR / Workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout untrusted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse workflow YAML
        run: bash scripts/ci-workflow-syntax.sh verify
      - name: Verify workflow, action-pin and branch-policy contracts
        run: |
          python3 scripts/ci-workflow-policy.py verify
          python3 scripts/ci-workflow-policy.py verify-pins
          python3 scripts/ci-branch-policy.py verify
          bash scripts/ci-tests.sh

  scope:
    name: PR / Scope plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      rust: ${{ steps.plan.outputs.rust }}
      packages: ${{ steps.plan.outputs.packages }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout history for an exact diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Plan conservative changed scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p target/ci
          python3 scripts/ci-scope.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            | tee target/ci/scope.json
      - name: Upload redacted scope evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-scope-${{ github.run_id }}
          path: target/ci/scope.json
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: PR / Fast Rust matrix
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    uses: ./.github/workflows/rust-reusable.yml
    with:
      check_prefix: PR / Fast Rust
      full_workspace: ${{ needs.scope.outputs.full == 'true' }}
      rust_packages: ${{ needs.scope.outputs.packages }}
    permissions:
      contents: read

  result:
    name: PR / Result taxonomy
    if: always()
    needs: [policy, scope, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout result verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Capture hosted job execution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/ci
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > target/ci/github-jobs.json
      - name: Classify job outcomes
        env:
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
        run: |
          mkdir -p target/ci
          allow=()
          if [[ "$RUST_SCOPE" == false ]]; then
            allow+=(--allow-skipped rust)
          fi
          python3 scripts/ci-result.py aggregate \
            --workflow "$GITHUB_WORKFLOW" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --output target/ci/result.json \
            --junit target/ci/result.xml \
            --github-jobs-json target/ci/github-jobs.json \
            --job "policy=${{ needs.policy.result }}" \
            --job "scope=${{ needs.scope.result }}" \
            --job "rust=${{ needs.rust.result }}" \
            --job-name "policy=PR / Workflow policy" \
            --job-name "scope=PR / Scope plan" \
            --job-name "rust=PR / Fast Rust matrix" \
            --kind policy=code \
            --kind scope=infra \
            --kind rust=code \
            "${allow[@]}"
      - name: Upload redacted CI result and JUnit envelope
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-ci-result-${{ github.run_id }}
          path: |
            target/ci/result.json
            target/ci/result.xml
            target/ci/github-jobs.json
          if-no-files-found: warn
          retention-days: 14
