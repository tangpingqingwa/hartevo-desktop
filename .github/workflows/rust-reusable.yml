name: Reusable / Rust gates

# Cordis/common Rust is an Ubuntu lane.  hartevo-desktop is a separate macOS
# lane; the Ubuntu lane never receives the desktop package selector.  Every
# gate delegates all-targets/all-features --locked execution to ci-rust-gate.

on:
  workflow_call:
    inputs:
      check_prefix:
        description: Stable check-name prefix for the caller tier.
        required: true
        type: string
      run_rust:
        description: Whether any Rust lane is relevant.
        required: true
        type: boolean
      run_common_rust:
        description: Execute relevant Cordis/common Rust packages on Ubuntu.
        required: true
        type: boolean
      run_desktop:
        description: Execute relevant hartevo-desktop packages on macOS.
        required: true
        type: boolean
      run_macos:
        description: Backwards-compatible alias for the desktop lane.
        required: true
        type: boolean
      full_workspace:
        description: Legacy caller flag retained for immutable Integration manifests.
        required: true
        type: boolean
      rust_packages:
        description: Backwards-compatible union of package selectors.
        required: true
        type: string
      common_rust_packages:
        description: JSON array of relevant non-desktop Rust package names.
        required: true
        type: string
      desktop_packages:
        description: JSON array of relevant macOS desktop package names.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hartevo-rust-reusable-${{ inputs.check_prefix }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target/ci-cargo

jobs:
  fmt:
    name: ${{ inputs.check_prefix }} / fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Planned scope skip marker
        if: ${{ !inputs.run_rust }}
        run: echo "Rust scope is empty; planned Rust checks are not executed."
      - name: Checkout reviewed source
        if: inputs.run_rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache Cargo and Rust toolchain
        if: inputs.run_rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: false
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains/1.95.0-*
            ~/.rustup/update
          key: hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-fmt-deps-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-${{ inputs.full_workspace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-fmt-deps-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-${{ inputs.full_workspace }}-
            hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-fmt-deps-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-
            hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-fmt-deps-all-targets-all-features-
      - name: Install the locked Rust components
        if: inputs.run_rust
        run: rustup component add clippy rustfmt rust-src --toolchain 1.95.0
      - name: Format gate
        if: inputs.run_rust
        run: bash scripts/ci-rust-gate.sh fmt

  clippy:
    name: ${{ inputs.check_prefix }} / clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    # A planned desktop skip still emits the stable macOS check name, but is
    # evaluated on Ubuntu without executing checkout or Cargo.
    runs-on: ${{ matrix.os == 'macos-15' && !inputs.run_desktop && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Planned scope skip marker
        if: ${{ !inputs.run_rust || (matrix.os == 'ubuntu-24.04' && !inputs.run_common_rust) || (matrix.os == 'macos-15' && !inputs.run_desktop) }}
        run: |
          if [[ "${{ inputs.run_rust }}" != true ]]; then
            echo "Rust scope is empty; planned Rust checks are not executed."
          elif [[ "${{ matrix.os }}" == ubuntu-24.04 ]]; then
            echo "Common Rust scope is empty; the Ubuntu lane is a planned skip."
          else
            echo "Desktop scope is empty; the macOS lane is a planned skip."
          fi
      - name: Checkout reviewed source
        if: inputs.run_rust && ((matrix.os == 'ubuntu-24.04' && inputs.run_common_rust) || (matrix.os == 'macos-15' && inputs.run_desktop))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Ubuntu common-Rust development libraries
        if: inputs.run_rust && matrix.os == 'ubuntu-24.04' && inputs.run_common_rust
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential pkg-config libssl-dev libglib2.0-dev libgtk-3-dev \
            libpango1.0-dev libatk1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Cache Cargo and Rust toolchain
        if: inputs.run_rust && ((matrix.os == 'ubuntu-24.04' && inputs.run_common_rust) || (matrix.os == 'macos-15' && inputs.run_desktop))
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: false
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains/1.95.0-*
            ~/.rustup/update
            target/ci-cargo
          key: hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-clippy-target-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-${{ inputs.full_workspace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-clippy-target-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-${{ inputs.full_workspace }}-
            hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-clippy-target-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-
            hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-clippy-target-all-targets-all-features-
      - name: Install the locked Rust components
        if: inputs.run_rust && ((matrix.os == 'ubuntu-24.04' && inputs.run_common_rust) || (matrix.os == 'macos-15' && inputs.run_desktop))
        run: rustup component add clippy rustfmt rust-src --toolchain 1.95.0
      - name: Strict Clippy gate
        if: inputs.run_rust && ((matrix.os == 'ubuntu-24.04' && inputs.run_common_rust) || (matrix.os == 'macos-15' && inputs.run_desktop))
        env:
          COMMON_PACKAGES: ${{ inputs.common_rust_packages }}
          DESKTOP_PACKAGES: ${{ inputs.desktop_packages }}
        run: |
          if [[ "${{ matrix.os }}" == ubuntu-24.04 ]]; then
            bash scripts/ci-rust-gate.sh clippy --packages "$COMMON_PACKAGES"
          else
            bash scripts/ci-rust-gate.sh clippy --packages "$DESKTOP_PACKAGES"
          fi

  test-ubuntu-shards:
    name: ${{ inputs.check_prefix }} / test shard ${{ matrix.shard }} of 2 (ubuntu-24.04)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Planned scope skip marker
        if: ${{ !inputs.run_common_rust }}
        run: echo "Common Rust scope is empty; planned Ubuntu test shard skip."
      - name: Checkout reviewed source
        if: inputs.run_common_rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: shard-plan
        name: Plan deterministic common-Rust shard
        if: inputs.run_common_rust
        env:
          COMMON_PACKAGES: ${{ inputs.common_rust_packages }}
        run: |
          mkdir -p target/ci
          python3 scripts/ci-rust-test-shards.py plan \
            --repo "$GITHUB_WORKSPACE" \
            --shard "${{ matrix.shard }}" \
            --shard-count 2 \
            --full-workspace false \
            --packages "$COMMON_PACKAGES" \
            --output "target/ci/rust-test-shard-${{ matrix.shard }}.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify deterministic Rust shard
        if: inputs.run_common_rust
        run: |
          python3 scripts/ci-rust-test-shards.py verify \
            --repo "$GITHUB_WORKSPACE" \
            --plan "target/ci/rust-test-shard-${{ matrix.shard }}.json"
      - name: Planned-empty shard marker
        if: inputs.run_common_rust && steps.shard-plan.outputs.has_packages == 'false'
        run: echo "This common-Rust shard is explicitly empty; desktop is never tested on Ubuntu."
      - name: Install Ubuntu common-Rust development libraries
        if: inputs.run_common_rust && steps.shard-plan.outputs.has_packages == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential pkg-config libssl-dev libglib2.0-dev libgtk-3-dev \
            libpango1.0-dev libatk1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Cache Cargo and Rust toolchain
        if: inputs.run_common_rust && steps.shard-plan.outputs.has_packages == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: false
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains/1.95.0-*
            ~/.rustup/update
            target/ci-cargo
          key: hartevo-rust-cache-v3-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-test-shard-${{ matrix.shard }}-layout-${{ steps.shard-plan.outputs.layout_digest }}-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-${{ inputs.full_workspace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hartevo-rust-cache-v3-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-test-shard-${{ matrix.shard }}-layout-${{ steps.shard-plan.outputs.layout_digest }}-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-${{ inputs.full_workspace }}-
            hartevo-rust-cache-v3-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-test-shard-${{ matrix.shard }}-layout-${{ steps.shard-plan.outputs.layout_digest }}-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-
            hartevo-rust-cache-v3-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-test-shard-${{ matrix.shard }}-layout-${{ steps.shard-plan.outputs.layout_digest }}-all-targets-all-features-
      - name: Install the locked Rust components
        if: inputs.run_common_rust && steps.shard-plan.outputs.has_packages == 'true'
        run: rustup component add clippy rustfmt rust-src --toolchain 1.95.0
      - name: Locked common-Rust shard test gate
        if: inputs.run_common_rust
        run: bash scripts/ci-rust-gate.sh test --plan "target/ci/rust-test-shard-${{ matrix.shard }}.json"

  test-ubuntu-result:
    name: ${{ inputs.check_prefix }} / test (ubuntu-24.04)
    needs: test-ubuntu-shards
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Planned scope skip marker
        if: ${{ !inputs.run_common_rust }}
        run: echo "Common Rust scope is empty; the Ubuntu aggregate confirms planned markers only."
      - name: Require successful Ubuntu common-Rust shards
        if: inputs.run_common_rust
        run: |
          if [[ "${{ needs.test-ubuntu-shards.result }}" != success ]]; then
            echo "Ubuntu common-Rust shard aggregate is fail-closed: ${{ needs.test-ubuntu-shards.result }}"
            exit 1
          fi

  test-macos:
    name: ${{ inputs.check_prefix }} / test (macos-15)
    runs-on: ${{ !inputs.run_desktop && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Planned scope skip marker
        if: ${{ !inputs.run_desktop }}
        run: echo "Desktop scope is empty; planned macOS test marker only."
      - name: Checkout reviewed source
        if: inputs.run_desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache Cargo and Rust toolchain
        if: inputs.run_desktop
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: false
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains/1.95.0-*
            ~/.rustup/update
            target/ci-cargo
          key: hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-test-target-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-${{ inputs.full_workspace }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-test-target-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-${{ inputs.full_workspace }}-
            hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-test-target-all-targets-all-features-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}-
            hartevo-rust-cache-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-test-target-all-targets-all-features-
      - name: Install the locked Rust components
        if: inputs.run_desktop
        run: rustup component add clippy rustfmt rust-src --toolchain 1.95.0
      - name: Locked macOS desktop test gate
        if: inputs.run_desktop
        env:
          DESKTOP_PACKAGES: ${{ inputs.desktop_packages }}
        run: bash scripts/ci-rust-gate.sh test --packages "$DESKTOP_PACKAGES"
