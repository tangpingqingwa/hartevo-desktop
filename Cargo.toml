[workspace]
members = [
  "hartevo-rs/application",
  "hartevo-rs/browser-adapter",
  "hartevo-rs/capability-gateway",
  "hartevo-rs/catalog",
  "hartevo-rs/cloud-storage",
  "hartevo-rs/connector-sdk",
  "hartevo-rs/commerce-connector",
  "hartevo-rs/context-fabric",
  "hartevo-rs/desktop",
  "hartevo-rs/domain-kernel",
  "hartevo-rs/effect-broker",
  "hartevo-rs/eval",
  "hartevo-rs/runtime-adapter",
  "hartevo-rs/mission-scheduler",
  "hartevo-rs/plugin-runtime",
  "hartevo-rs/storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
authors = ["Hartevo"]
repository = "https://github.com/tangpingqingwa/hartevo-desktop"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
command-group = "5.0.1"
command-fds = "0.3.3"
crossbeam-channel = "0.5.16"
dioxus = { version = "=0.7.10", default-features = false, features = ["launch", "lib"] }
hex = "0.4"
keyring-core = "=1.0.0"
libc = "0.2"
loom = "0.7.2"
os_pipe = "1.2.3"
proptest = "1.11.0"
ring = "0.17.14"
rusqlite = { version = "0.38", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
rust_decimal = { version = "1.39", default-features = false, features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tempfile = "3.20"
thiserror = "2.0"
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v7"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
